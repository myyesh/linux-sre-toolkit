name: SRE Ops Platform CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform configuration
        working-directory: terraform/aws-ec2
        run: |
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f kubernetes/manifests/namespace.yaml
          kubectl apply --dry-run=client -f kubernetes/manifests/configmap.yaml
          kubectl apply --dry-run=client -f kubernetes/manifests/deployment.yaml
          kubectl apply --dry-run=client -f kubernetes/manifests/service.yaml

      - name: Validate shell script syntax
        run: |
          bash -n scripts/log_monitor.sh
          bash -n scripts/check_all_logs.sh
          bash -n scripts/system_health.sh
          bash -n nginx-deployment/scripts/deploy_site.sh
          bash -n nginx-deployment/scripts/validate_nginx.sh
          bash -n nginx-deployment/scripts/check_site.sh
          bash -n monitoring/site_health_check.sh
          bash -n monitoring/docker_health_check.sh
          bash -n monitoring/system_metrics.sh
          bash -n kubernetes/scripts/deploy_k8s.sh
          bash -n kubernetes/scripts/check_k8s.sh
          bash -n kubernetes/scripts/cleanup_k8s.sh

      - name: Validate shell scripts are executable
        run: |
          test -x scripts/log_monitor.sh
          test -x scripts/check_all_logs.sh
          test -x scripts/system_health.sh
          test -x nginx-deployment/scripts/deploy_site.sh
          test -x nginx-deployment/scripts/validate_nginx.sh
          test -x nginx-deployment/scripts/check_site.sh
          test -x monitoring/site_health_check.sh
          test -x monitoring/docker_health_check.sh
          test -x monitoring/system_metrics.sh
          test -x kubernetes/scripts/deploy_k8s.sh
          test -x kubernetes/scripts/check_k8s.sh
          test -x kubernetes/scripts/cleanup_k8s.sh

      - name: Validate Docker build
        run: |
          docker build -t sre-ops-static-site .

      - name: Run container and test site
        run: |
          docker run -d -p 8080:80 --name sre-ops-site sre-ops-static-site
          sleep 3
          curl -f http://localhost:8080

      - name: Run monitoring checks
        run: |
          ./monitoring/site_health_check.sh http://localhost:8080
          ./monitoring/docker_health_check.sh
          ./monitoring/system_metrics.sh
